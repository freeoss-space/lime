version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - gocritic
    - revive

  settings:
    errcheck:
      exclude-functions:
        # Closing response bodies in defer is standard Go; errors are unactionable.
        - (net/http.Response).Body.Close
        - (io.ReadCloser).Close
        - (io.Closer).Close
        # Terminal output errors are unactionable in CLI tools.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    revive:
      rules:
        # Interface implementations inherit docs from the interface; skip per-method comments.
        - name: exported
          disabled: true
        # main packages conventionally have no package comment.
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/freeoss-space/lime

issues:
  exclude-rules:
    # Test files: errcheck and unused-parameter are expected.
    - path: "_test\\.go"
      linters:
        - errcheck
    - path: "_test\\.go"
      linters:
        - revive
      text: "unused-parameter"
